name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy

jobs:
  lint:
    name: Lint, types and module boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - name: ruff (lint)
        run: uv run ruff check .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy atlas/
      # Enforces the module API contracts required by Blueprint §22: a change
      # that reaches into another module's models or repository fails here
      # rather than being caught in review, or not at all.
      - name: import-linter
        run: uv run lint-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Blueprint calls for PostgreSQL 14+. Pinned to 16 to match the version
        # the schema and its triggers were verified against.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATLAS_TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      # Provisioning a database from empty is the documented deployment path;
      # nothing else in this job exercises it, since the fixture below applies
      # db/schema.sql directly rather than through the migration chain.
      - name: Alembic upgrade head (empty database)
        env:
          ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@localhost:5432/atlas_test
        run: uv run alembic upgrade head
      - name: Unit tests
        run: uv run pytest -m unit
      - name: Integration tests
        run: uv run pytest -m integration
      # Called out separately so a green build can never mean "the chain test
      # was skipped because no database was available". Its absence is a
      # failure, not a silent pass — see tests/integration/.
      - name: Audit hash-chain integrity
        run: uv run pytest tests/integration/test_audit_hash_chain_integrity.py -v
      - name: Coverage
        run: uv run pytest --cov=atlas --cov-report=term-missing --cov-fail-under=80

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - name: bandit
        run: uv run bandit -r atlas/ -ll
      - name: pip-audit
        run: uv run pip-audit
